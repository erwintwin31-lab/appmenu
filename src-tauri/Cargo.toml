[package]
name = "appmenu"
version = "0.1.0"
edition = "2021"

[lib]
name = "appmenu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
sha2 = "0.11"
rfd = "0.17"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
