[package]
name = "appmenu-cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "Standalone Appmenu CLI without a GUI runtime"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ctrlc = "3.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
