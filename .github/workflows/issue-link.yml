name: Issue link
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot ausgenommen
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "Dependabot-PR: kein Issue erforderlich."
      - name: Issue pruefen
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const match = body.match(/(?:close[sd]?|fix(?:e[sd]?)?|resolve[sd]?)\s+#(\d+)/i);
            if (!match) {
              core.setFailed("Der PR muss ein Issue mit 'Closes #123' referenzieren.");
              return;
            }
            const {data: issue} = await github.rest.issues.get({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(match[1])
            });
            if (issue.pull_request) {
              core.setFailed("Die Referenz muss ein Issue, kein PR sein.");
              return;
            }
            if (issue.state !== "open") core.setFailed("Das referenzierte Issue muss offen sein.");
