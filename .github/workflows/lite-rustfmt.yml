name: Lite rustfmt fix
on:
  push:
    branches: [fix/lite-permissions-and-install-safety]
    paths:
      - src-tauri/src/lib.rs
      - src-tauri/src/safety.rs
      - .github/workflows/lite-rustfmt.yml
permissions:
  contents: read
concurrency:
  group: lite-rustfmt-fix
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'erwintwin31-lab/appmenu' && github.ref == 'refs/heads/fix/lite-permissions-and-install-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      FIX_BRANCH: fix/lite-permissions-and-install-safety
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Verify formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Commit only the two security files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src-tauri/src/lib.rs src-tauri/src/safety.rs
          if ! git diff --cached --quiet; then
            git commit -m 'style: format Lite security changes with rustfmt'
            git push origin "HEAD:refs/heads/$FIX_BRANCH"
          fi
      - name: Run existing CI on the branch
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: 'fix/lite-permissions-and-install-safety'
            });
