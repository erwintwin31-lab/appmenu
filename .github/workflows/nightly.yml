name: Nightly
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional: aelteren Stand nachbauen (Commit-SHA, Branch oder Tag). Leer = aktueller Stand."
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          BUILD=true
          LAST_TAG=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name | test("-nightly\\.")) | .tag_name' | head -n 1)
          if [ "$EVENT" = "schedule" ] && [ -n "$LAST_TAG" ]; then
            LAST_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${LAST_TAG}" --jq .target_commitish)
            if git cat-file -e "${LAST_SHA}^{commit}" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$LAST_SHA" HEAD -- src src-tauri package.json package-lock.json scripts)
              if [ -z "$CHANGED" ]; then
                BUILD=false
              fi
            fi
          fi
          echo "Nightly bauen: $BUILD (letzter Nightly: ${LAST_TAG:-keiner})"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
  prepare:
    needs: [check]
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      tag: ${{ steps.create.outputs.tag }}
      version: ${{ steps.create.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_INPUT: ${{ inputs.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short=7 HEAD)
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ -n "$REF_INPUT" ]; then
            DATE=$(git show -s --format=%cs HEAD)
            TAG="v${VERSION}-rebuild.${SHORT}"
            TITLE="Appmenu Nachbau ${SHORT} vom ${DATE} (ungetestet)"
            HEADLINE="**NACHBAU eines aelteren Standes (Commit ${SHORT} vom ${DATE}), UNGETESTET.**"
            INTRO="Dieser Build wurde nachtraeglich von Hand aus einem aelteren Commit erzeugt. Er wurde nicht getestet und ist nicht fuer den produktiven Einsatz gedacht. Nutzung auf eigene Gefahr."
          else
            DATE=$(date -u +%Y-%m-%d)
            TAG="v${VERSION}-nightly.$(date -u +%Y%m%d).${RUN_NUMBER}"
            TITLE="Appmenu Nightly ${DATE} (ungetestet)"
            HEADLINE="**NIGHTLY-BUILD vom ${DATE}, UNGETESTET.**"
            INTRO="Dieser Build entsteht automatisch jede Nacht, wenn sich der Code geaendert hat. Er wurde nicht von Hand getestet und ist nicht fuer den produktiven Einsatz gedacht. Nutzung auf eigene Gefahr."
          fi
          BODY=$(cat <<EOF
          ${HEADLINE}

          ${INTRO}

          - Version: ${TAG}
          - Commit: ${SHA}
          - Build-Lauf: ${RUN_URL}
          - Pruefsummen: SHA256SUMS.txt

          Linux: Das AppImage vor dem Start ausfuehrbar machen. Die Installationsfunktionen (winget) sind unter Linux noch nicht umgesetzt.
          EOF
          )
          ID=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$TAG" -f target_commitish="$SHA" \
            -f name="$TITLE" -f body="$BODY" \
            -F draft=true -F prerelease=true --jq .id)
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
  assets:
    needs: [check]
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Icons und Installer-Bilder erzeugen
        shell: pwsh
        run: |
          ./scripts/make-assets.ps1
          npx tauri icon src-tauri/app-icon.png -o src-tauri/icons
          New-Item -ItemType Directory -Force -Path assets-out | Out-Null
          Copy-Item src-tauri/icons assets-out/icons -Recurse
          Copy-Item src-tauri/installer assets-out/installer -Recurse
          Copy-Item src-tauri/app-icon.png assets-out/app-icon.png
      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: assets-out
          if-no-files-found: error
  build:
    needs: [prepare, assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: "--target x86_64-unknown-linux-gnu --bundles deb,appimage"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 file
        if: runner.os == 'Linux'
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
      - name: Portable exe hochladen
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          NAME="Appmenu_${VERSION}_portable.exe"
          cp src-tauri/target/release/appmenu.exe "$NAME"
          gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${ID}/assets?name=${NAME}" --input "$NAME"
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - name: Pruefsummen erzeugen und Release veroeffentlichen
        run: |
          mkdir dl
          gh api "repos/${GITHUB_REPOSITORY}/releases/${ID}" --jq '.assets[] | "\(.id)\t\(.name)"' | while IFS=$'\t' read -r AID NAME; do
            gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${AID}" > "dl/${NAME}"
          done
          cd dl
          sha256sum -- * > ../SHA256SUMS.txt
          cd ..
          gh api --method POST -H "Content-Type: text/plain" "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${ID}/assets?name=SHA256SUMS.txt" --input SHA256SUMS.txt
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${ID}" -F draft=false
  cleanup:
    needs: [prepare, build, publish]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.build.result != 'success' || needs.publish.result != 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - name: Entwurf loeschen
        run: |
          if [ -n "$ID" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${ID}" || true
          fi
  prune:
    needs: [check, publish]
    if: ${{ always() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Alte Nightlies und Pre-Releases loeschen
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | [.created_at, .tag_name] | @tsv' > all.tsv
          prune() {
            PATTERN="$1"
            KEEP="$2"
            grep -E -e "$PATTERN" all.tsv | sort -r | tail -n +$((KEEP + 1)) | cut -f2 | while read -r TAG; do
              echo "Loesche $TAG"
              RID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${RID}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" || true
            done
          }
          prune '-nightly\.' 7
          prune '-pre\.[0-9]+$' 5
