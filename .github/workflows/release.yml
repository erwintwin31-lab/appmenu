name: Release
on:
  push:
    tags: ["v*"]
jobs:
  assets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Icons und Installer-Bilder erzeugen
        shell: pwsh
        run: |
          ./scripts/make-assets.ps1
          npx tauri icon src-tauri/app-icon.png -o src-tauri/icons
          New-Item -ItemType Directory -Force -Path assets-out | Out-Null
          Copy-Item src-tauri/icons assets-out/icons -Recurse
          Copy-Item src-tauri/installer assets-out/installer -Recurse
          Copy-Item src-tauri/app-icon.png assets-out/app-icon.png
      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: assets-out
          if-no-files-found: error
  release:
    needs: [assets]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: "--target x86_64-unknown-linux-gnu --bundles deb,appimage"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 file
        if: runner.os == 'Linux'
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Appmenu ${{ github.ref_name }}"
          releaseBody: "Automatischer Release-Build fuer Linux (AppImage, deb) und Windows (Installer)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
